<div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
    <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">Resumen</h3>

    <div class="space-y-2">
        <div class="flex justify-between">
            <span class="text-sm text-gray-600 dark:text-gray-400">Subtotal:</span>
            <span class="text-sm font-medium text-gray-900 dark:text-white">${{ sale.subtotal }}</span>
        </div>

        <div class="flex justify-between">
            <span class="text-sm text-gray-600 dark:text-gray-400">Descuento Global:</span>
            <span class="text-sm font-medium text-red-600 dark:text-red-400">-${{ sale.global_discount_amount }}</span>
        </div>

        <hr class="border-gray-300 dark:border-gray-600">

        <div class="flex justify-between">
            <span class="text-base font-semibold text-gray-900 dark:text-white">Total:</span>
            <span class="text-base font-bold text-gray-900 dark:text-white">${{ sale.total }}</span>
        </div>

        <div class="flex justify-between">
            <span class="text-sm text-gray-600 dark:text-gray-400">Pagado:</span>
            <span class="text-sm font-medium text-green-600 dark:text-green-400">${{ sale.total_paid }}</span>
        </div>

        <hr class="border-gray-300 dark:border-gray-600">

        <div class="flex justify-between">
            <span class="text-lg font-bold text-gray-900 dark:text-white">Saldo:</span>
            <span class="text-lg font-bold {% if sale.remaining_balance > 0 %}text-red-600 dark:text-red-400{% else %}text-green-600 dark:text-green-400{% endif %}">
                ${{ sale.remaining_balance }}
            </span>
        </div>
    </div>
</div>
