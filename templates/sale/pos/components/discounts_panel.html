<section class="card p-5 shadow-float">
    <h2 class="text-sm uppercase tracking-wider font-bold text-amber-600 mb-4">Descuentos</h2>

    <div class="grid grid-cols-2 gap-3">
        <button
            @click="openUnitDiscountModal()"
            :disabled="lineItems.length === 0"
            class="btn py-3 bg-white border border-gray-300 hover:border-amber-500 rounded-lg text-sm font-bold text-gray-700 hover:text-amber-600 disabled:opacity-50 disabled:cursor-not-allowed">
            Desc. Unitario
        </button>
        <button
            @click="openGlobalDiscountModal()"
            :disabled="lineItems.length === 0"
            class="btn py-3 bg-white border border-gray-300 hover:border-amber-500 rounded-lg text-sm font-bold text-gray-700 hover:text-amber-600 disabled:opacity-50 disabled:cursor-not-allowed">
            Desc. Global
        </button>
    </div>

    <div x-show="globalDiscountPercentage > 0" class="mt-3 p-3 bg-amber-50 rounded-lg border border-amber-200">
        <div class="flex items-center justify-between">
            <span class="text-sm text-amber-700 font-semibold">Descuento global: <span x-text="globalDiscountPercentage.toFixed(1)"></span>%</span>
            <span class="font-mono font-bold text-amber-800" x-text="formatCurrency(globalDiscount)"></span>
        </div>
    </div>
</section>
