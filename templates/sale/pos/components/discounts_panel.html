<section class="card p-6 shadow-float">
    <h2 class="text-sm uppercase tracking-wider font-bold text-amber-600 mb-6">Descuentos</h2>

    <div class="grid grid-cols-2 gap-4">
        <button
            @click="openUnitDiscountModal()"
            :disabled="lineItems.length === 0"
            class="btn py-4 bg-white border border-gray-300 hover:border-amber-500 rounded-lg text-sm font-semibold text-gray-700 hover:text-amber-600 disabled:opacity-50 disabled:cursor-not-allowed">
            Descuento por Producto
        </button>
        <button
            @click="openGlobalDiscountModal()"
            :disabled="lineItems.length === 0"
            class="btn py-4 bg-white border border-gray-300 hover:border-amber-500 rounded-lg text-sm font-semibold text-gray-700 hover:text-amber-600 disabled:opacity-50 disabled:cursor-not-allowed">
            Descuento Global (%)
        </button>
    </div>

    <div x-show="globalDiscountPercentage > 0" class="mt-4 p-4 bg-amber-50 rounded-lg border border-amber-200">
        <div class="flex items-center justify-between">
            <span class="text-sm text-amber-700 font-medium">Descuento global: <span x-text="globalDiscountPercentage"></span>%</span>
            <span class="font-mono font-bold text-amber-700" x-text="formatCurrency(globalDiscount)"></span>
        </div>
    </div>
</section>
