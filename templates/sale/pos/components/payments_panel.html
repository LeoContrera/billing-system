<section class="card p-6 shadow-float">
    <h2 class="text-sm uppercase tracking-wider font-bold text-blue-600 mb-6">Métodos de Pago</h2>

    <div class="space-y-3">
        <template x-for="(payment, index) in payments" :key="index">
            <div class="p-4 bg-green-50 rounded-lg border border-green-200 animate-slide-in">
                <div class="flex items-center gap-3">
                    <div class="flex-1">
                        <div class="text-sm font-semibold text-gray-900" x-text="payment.method"></div>
                        <div class="text-xs text-gray-600 mt-0.5">
                            <template x-if="payment.cardType">
                                <span>
                                    <span x-text="payment.cardType"></span>
                                    <template x-if="payment.installments > 1">
                                        <span> · <span x-text="payment.installments"></span> cuotas</span>
                                    </template>
                                    <template x-if="payment.interestRate > 0">
                                        <span> · <span x-text="payment.interestRate"></span>% interés</span>
                                    </template>
                                </span>
                            </template>
                            <template x-if="!payment.cardType">
                                <span>Registrado</span>
                            </template>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-mono text-lg font-bold text-green-600" x-text="formatCurrency(payment.totalAmount)"></div>
                        <template x-if="payment.interestRate > 0">
                            <div class="text-xs text-gray-600">
                                Base: <span class="font-mono" x-text="formatCurrency(payment.amount)"></span>
                            </div>
                        </template>
                    </div>
                    <button
                        @click="removePayment(index)"
                        class="text-red-600 hover:text-red-700 transition-colors text-xs font-semibold">
                        ✕
                    </button>
                </div>
            </div>
        </template>

        <div x-show="payments.length === 0" class="text-center py-6 text-gray-500 text-sm">
            No hay pagos registrados
        </div>
    </div>

    <div class="mt-6 pt-6 border-t border-gray-200">
        <button
            @click="openPaymentModal()"
            class="btn w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm shadow-float">
            + Agregar Método de Pago
        </button>
    </div>
</section>
