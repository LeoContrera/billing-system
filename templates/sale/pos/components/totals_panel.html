<section class="card p-6 shadow-float-lg bg-gradient-to-br from-blue-50 to-indigo-50 border-2 border-blue-200">
    <div class="space-y-3">
        <div class="text-center mb-3">
            <div class="text-xs uppercase tracking-widest font-bold text-blue-600 mb-2">Total de Venta</div>
            <div class="font-mono text-5xl font-black text-gray-900 number-animate" x-text="formatCurrency(calculateTotal())"></div>
        </div>

        <div class="divider"></div>

        <!-- Breakdown de montos -->
        <div class="space-y-2 text-sm">
            <div class="flex justify-between items-center">
                <span class="text-gray-600 font-medium">Subtotal bruto</span>
                <span class="font-mono font-semibold text-gray-900" x-text="formatCurrency(calculateGrossSubtotal())"></span>
            </div>

            <!-- Descuentos unitarios (si existen) -->
            <div x-show="calculateUnitDiscounts() > 0" class="flex justify-between items-center text-amber-600">
                <span class="font-medium">Descuentos unitarios</span>
                <span class="font-mono font-semibold" x-text="'-' + formatCurrency(calculateUnitDiscounts())"></span>
            </div>

            <!-- Descuento global (si existe) -->
            <div x-show="globalDiscountAmount > 0" class="flex justify-between items-center text-amber-600">
                <span class="font-medium">
                    Descuento global
                    <span x-show="globalDiscountPercentage > 0" class="text-xs">
                        (<span x-text="globalDiscountPercentage.toFixed(1)"></span>%)
                    </span>
                </span>
                <span class="font-mono font-semibold" x-text="'-' + formatCurrency(globalDiscountAmount)"></span>
            </div>
        </div>
    </div>
</section>
