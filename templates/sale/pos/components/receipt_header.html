<section class="card p-6 shadow-float bg-gradient-to-r from-indigo-50 to-purple-50 border-2 border-indigo-200">
    <div class="flex items-center justify-between">
        <div class="flex-1">
            <div class="text-xs uppercase tracking-wider text-indigo-600 font-semibold mb-1">Tipo de Comprobante</div>
            <div class="text-3xl font-black text-indigo-900" x-text="getCurrentReceiptType()"></div>
            <div class="text-xs text-indigo-600 mt-2">
                <span x-show="!customer.id && customerMode === 'search'">
                    Sin identificar cliente (venta menor a tope ARCA)
                </span>
                <span x-show="!customer.id && customerMode === 'create'">
                    Vista previa con cliente <span class="font-semibold" x-text="getTaxCategoryDisplay(newCustomer.taxCategory)"></span>
                </span>
                <span x-show="customer.id">
                    Con identificación: <span class="font-semibold" x-text="customer.taxCategoryDisplay"></span>
                </span>
            </div>
        </div>
        <div class="text-right">
            <div class="text-xs text-indigo-600 mb-1">Emisor</div>
            <div class="text-sm font-bold text-indigo-900">Responsable Inscripto</div>
        </div>
    </div>
</section>
