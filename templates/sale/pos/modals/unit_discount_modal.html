<div
    x-show="showUnitDiscountModal"
    x-cloak
    @click.self="showUnitDiscountModal = false"
    class="fixed inset-0 bg-gray-900 bg-opacity-20 flex items-center justify-center z-50 p-4"
    style="display: none;">
    <div class="card p-8 max-w-2xl w-full animate-slide-in shadow-float-lg" @click.stop>
        <h3 class="text-xl font-bold mb-6 text-amber-600">Descuento por Producto</h3>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-3 uppercase tracking-wide">Seleccionar Productos</label>
                <div class="space-y-2 max-h-60 overflow-y-auto border border-gray-200 rounded-lg p-3 bg-gray-50">
                    <template x-for="(item, index) in lineItems" :key="item.id">
                        <label class="flex items-center gap-3 p-3 bg-white rounded border border-gray-200 hover:border-amber-300 cursor-pointer transition-colors">
                            <input
                                type="checkbox"
                                :value="item.id"
                                x-model="selectedProductsForDiscount"
                                class="w-4 h-4 text-amber-600 border-gray-300 rounded focus:ring-amber-500">
                            <div class="flex-1">
                                <div class="text-sm font-semibold text-gray-900" x-text="item.description"></div>
                                <div class="text-xs text-gray-600">
                                    <span x-text="item.sku"></span> -
                                    <span x-text="formatCurrency(item.unitPrice)"></span> x
                                    <span x-text="item.quantity"></span>
                                </div>
                            </div>
                            <div class="font-mono text-sm font-bold text-gray-900" x-text="formatCurrency(item.quantity * item.unitPrice)"></div>
                        </label>
                    </template>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Porcentaje de Descuento</label>
                <div class="relative">
                    <input
                        type="number"
                        x-model="tempUnitDiscountPercentage"
                        min="0"
                        max="100"
                        step="0.01"
                        class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 pr-10 text-sm font-mono text-gray-900"
                        placeholder="0.00">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-mono font-semibold">%</span>
                </div>
                <div x-show="selectedProductsForDiscount.length > 0 && tempUnitDiscountPercentage > 0" class="mt-2 text-sm text-gray-600">
                    <span x-text="selectedProductsForDiscount.length"></span> producto(s) seleccionado(s)
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button
                    @click="showUnitDiscountModal = false; selectedProductsForDiscount = []; tempUnitDiscountPercentage = 0"
                    class="btn flex-1 py-3 bg-white border-2 border-gray-300 text-gray-700 rounded-lg font-semibold text-sm hover:bg-gray-50">
                    Cancelar
                </button>
                <button
                    @click="applyUnitDiscount()"
                    :disabled="selectedProductsForDiscount.length === 0 || tempUnitDiscountPercentage <= 0 || isLoading"
                    class="btn flex-1 py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-lg font-bold text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <span x-show="!isLoading">Aplicar Descuento</span>
                    <span x-show="isLoading">Aplicando...</span>
                </button>
            </div>
        </div>
    </div>
</div>
