<div
    x-show="showProductModal"
    x-cloak
    @click.self="showProductModal = false"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
    style="display: none;">
    <div class="card p-8 max-w-lg w-full animate-slide-in shadow-float-lg" @click.stop>
        <h3 class="text-xl font-bold mb-6 text-blue-600">Agregar Producto</h3>

        <div class="space-y-4">
            <div class="relative">
                <label class="block text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Buscar Producto</label>
                <input
                    type="text"
                    x-model="productSearch"
                    @input.debounce.300ms="searchProducts()"
                    class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-sm text-gray-900"
                    placeholder="Buscar por SKU o nombre...">

                <div
                    x-show="productResults.length > 0"
                    class="mt-2 bg-white border border-gray-300 rounded-lg shadow-float max-h-48 overflow-y-auto">
                    <template x-for="p in productResults" :key="p.sku">
                        <button
                            @click="selectProduct(p)"
                            class="w-full px-4 py-3 text-left hover:bg-blue-50 border-b border-gray-100 last:border-0 transition-colors">
                            <div class="flex justify-between items-center">
                                <div>
                                    <span class="font-mono text-sm font-medium text-amber-600" x-text="p.sku"></span>
                                    <span class="text-sm font-medium text-gray-900 ml-2" x-text="p.name"></span>
                                </div>
                                <span class="font-mono text-sm font-bold text-gray-900" x-text="formatCurrency(parseFloat(p.price))"></span>
                            </div>
                        </button>
                    </template>
                </div>
            </div>

            <div x-show="selectedProduct" class="p-4 bg-blue-50 rounded-lg border border-blue-200">
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <span class="font-mono text-sm font-medium text-amber-600" x-text="selectedProduct?.sku"></span>
                        <div class="text-sm font-bold text-gray-900" x-text="selectedProduct?.name"></div>
                    </div>
                    <span class="font-mono text-lg font-bold text-gray-900" x-text="selectedProduct ? formatCurrency(parseFloat(selectedProduct.price)) : ''"></span>
                </div>

                <div x-show="stockInfo !== null" class="text-xs mb-3">
                    <span x-show="stockInfo?.available" class="text-green-600 font-medium">Stock disponible</span>
                    <span x-show="stockInfo && !stockInfo.available" class="text-red-600 font-medium">Stock insuficiente</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Cantidad</label>
                    <input
                        type="number"
                        x-model="newItemQuantity"
                        @input="checkStock()"
                        min="1"
                        step="1"
                        class="w-full bg-white border border-gray-300 rounded-lg px-4 py-2.5 text-sm font-mono text-gray-900">
                </div>
            </div>

            <div x-show="productError" class="p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm" x-text="productError"></div>

            <div class="flex gap-3 mt-6">
                <button
                    @click="closeProductModal()"
                    class="btn flex-1 py-3 bg-white border-2 border-gray-300 text-gray-700 rounded-lg font-semibold text-sm hover:bg-gray-50">
                    Cancelar
                </button>
                <button
                    @click="addProduct()"
                    :disabled="!canAddProduct() || isLoading"
                    class="btn flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <span x-show="!isLoading">Agregar</span>
                    <span x-show="isLoading">Agregando...</span>
                </button>
            </div>
        </div>
    </div>
</div>
