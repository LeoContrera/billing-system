{% load static %}
<div
    x-show="showPaymentModal"
    x-cloak
    @click.self="showPaymentModal = false"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
    style="display: none;">
    <div class="card p-8 max-w-lg w-full animate-slide-in shadow-float-lg max-h-[90vh] overflow-y-auto" @click.stop>
        <h3 class="text-xl font-bold mb-6 text-blue-600">Agregar Pago</h3>

        <div id="payment-error" class="mb-4"></div>

        <form
            id="payment-form"
            @submit.prevent="submitPayment($event)">

            <input type="hidden" name="sale_id" value="{{ sale.id }}">

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Método de Pago</label>
                    <select
                        name="payment_method_id"
                        x-model="newPayment.methodId"
                        @change="resetPaymentDetails()"
                        class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-sm text-gray-900"
                        required>
                        {% for pm in payment_methods %}
                        <option value="{{ pm.id }}" data-type="{{ pm.method_type }}">{{ pm.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div x-show="newPayment.requiresCard" class="animate-slide-in">
                    <label class="block text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Tipo de Tarjeta</label>
                    <select
                        name="card_type"
                        x-model="newPayment.cardType"
                        class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-sm text-gray-900"
                        :required="newPayment.requiresCard">
                        <option value="">Seleccionar...</option>
                        <option value="VISA">VISA</option>
                        <option value="MASTERCARD">Mastercard</option>
                        <option value="AMEX">American Express</option>
                        <option value="CABAL">Cabal</option>
                        <option value="NARANJA">Naranja</option>
                        <option value="MAESTRO">Maestro</option>
                        <option value="OTHER">Otra</option>
                    </select>
                </div>

                <div x-show="newPayment.isCredit" class="animate-slide-in">
                    <label class="block text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Cuotas</label>
                    <select
                        name="installments"
                        x-model="newPayment.installments"
                        @change="fetchInterestPreview()"
                        class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-sm text-gray-900">
                        <option value="1">1 cuota (sin interés)</option>
                        <option value="3">3 cuotas</option>
                        <option value="6">6 cuotas</option>
                        <option value="9">9 cuotas</option>
                        <option value="12">12 cuotas</option>
                        <option value="18">18 cuotas</option>
                        <option value="24">24 cuotas</option>
                    </select>
                </div>

                <div x-show="newPayment.isCredit && newPayment.installments > 1" class="animate-slide-in">
                    <label class="block text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Tasa de Interés (%)</label>
                    <div class="relative">
                        <input
                            type="number"
                            name="interest_rate"
                            x-model="newPayment.interestRate"
                            @input.debounce.500ms="fetchInterestPreview()"
                            min="0"
                            max="100"
                            step="0.01"
                            class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 pr-10 text-sm font-mono text-gray-900"
                            placeholder="0.00">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 font-mono font-semibold">%</span>
                    </div>
                    <div class="mt-1 text-xs text-gray-600">
                        Tasa mensual aplicada al monto base
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-2 uppercase tracking-wide">Monto Base</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-mono font-semibold">$</span>
                        <input
                            type="number"
                            name="amount"
                            x-model="newPayment.amount"
                            @input.debounce.500ms="fetchInterestPreview()"
                            step="0.01"
                            min="0.01"
                            class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 pl-8 text-sm font-mono text-gray-900"
                            placeholder="0.00"
                            required>
                    </div>
                    <div class="mt-2 text-xs text-gray-600">
                        Saldo restante: <span class="font-mono font-semibold text-amber-600" x-text="formatCurrency(calculateRemaining())"></span>
                    </div>
                </div>

                <div id="interest-preview"></div>

                <div class="flex gap-3 mt-6">
                    <button
                        type="button"
                        @click="closePaymentModal()"
                        class="btn flex-1 py-3 bg-white border-2 border-gray-300 text-gray-700 rounded-lg font-semibold text-sm hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button
                        type="submit"
                        :disabled="newPayment.isSubmitting"
                        class="btn flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                        <span x-show="!newPayment.isSubmitting">Agregar</span>
                        <span x-show="newPayment.isSubmitting">
                            <svg class="animate-spin h-5 w-5 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Procesando...
                        </span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
