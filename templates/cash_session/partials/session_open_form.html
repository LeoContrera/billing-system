<!-- Header -->
<div class="bg-white rounded-lg border border-gray-200 p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-2">Apertura de Caja</h2>
    <p class="text-sm text-gray-600">
        Registra el monto inicial en efectivo con el que inicias tu turno.
    </p>
</div>

<!-- Error Message -->
{% if error %}
<div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
    <div class="flex items-start gap-3">
        <svg class="h-5 w-5 text-red-600 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <div>
            <p class="text-sm font-medium text-red-800">{{ error }}</p>
        </div>
    </div>
</div>
{% endif %}

<!-- Opening Form -->
<div class="bg-white rounded-lg border border-gray-200 p-6">
    <form hx-post="{% url 'cash_session:session-control' %}"
          hx-target="#session-control-container"
          hx-swap="innerHTML"
          hx-indicator="#submit-indicator"
          class="space-y-6">
        {% csrf_token %}

        <!-- Opening Balance Input -->
        <div>
            <label for="opening_balance" class="block text-sm font-medium text-gray-700 mb-2">
                Monto Inicial <span class="text-red-500">*</span>
            </label>
            <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 font-medium">$</span>
                <input
                    type="number"
                    id="opening_balance"
                    name="opening_balance"
                    step="0.01"
                    min="0"
                    value="0.00"
                    required
                    autofocus
                    class="block w-full rounded-lg border-gray-300 pl-7 pr-4 py-2.5 text-lg font-semibold tabular-nums focus:border-blue-500 focus:ring-blue-500"
                    placeholder="0.00">
            </div>
        </div>

        <!-- Quick Amount Buttons -->
        <div>
            <p class="block text-sm font-medium text-gray-700 mb-2">Montos Rápidos</p>
            <div class="grid grid-cols-4 gap-2">
                <button
                    type="button"
                    onclick="document.getElementById('opening_balance').value = '0.00'"
                    class="px-3 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-lg text-sm font-medium transition border border-gray-200">
                    $ 0
                </button>
                <button
                    type="button"
                    onclick="document.getElementById('opening_balance').value = '500.00'"
                    class="px-3 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-lg text-sm font-medium transition border border-gray-200">
                    $ 500
                </button>
                <button
                    type="button"
                    onclick="document.getElementById('opening_balance').value = '1000.00'"
                    class="px-3 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-lg text-sm font-medium transition border border-gray-200">
                    $ 1,000
                </button>
                <button
                    type="button"
                    onclick="document.getElementById('opening_balance').value = '2000.00'"
                    class="px-3 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 rounded-lg text-sm font-medium transition border border-gray-200">
                    $ 2,000
                </button>
            </div>
        </div>

        <!-- Submit Button -->
        <button
            type="submit"
            class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition">
            Abrir Caja
        </button>

        <!-- Loading Indicator -->
        <div id="submit-indicator" class="htmx-indicator text-center">
            <div class="flex items-center justify-center gap-2 text-blue-600 text-sm">
                <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Abriendo caja...</span>
            </div>
        </div>
    </form>
</div>
