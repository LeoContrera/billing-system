<div class="max-w-md mx-auto">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Caja Abierta</h2>
            <span class="bg-green-100 text-green-800 text-xs font-medium px-2.5 py-0.5 rounded dark:bg-green-900 dark:text-green-300">
                ACTIVA
            </span>
        </div>

        <div class="space-y-4">
            <div class="p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-1">Cajero</p>
                <p class="text-lg font-semibold text-gray-900 dark:text-white">{{ session.user.username }}</p>
            </div>

            <div class="p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-1">Hora de Apertura</p>
                <p class="text-lg font-semibold text-gray-900 dark:text-white">
                    {{ session.opening_timestamp|date:"d/m/Y H:i" }}
                </p>
            </div>

            <div class="p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-200 dark:border-blue-800">
                <p class="text-sm text-blue-600 dark:text-blue-400 mb-1">Monto Inicial</p>
                <p class="text-2xl font-bold text-blue-700 dark:text-blue-300">
                    ${{ session.opening_balance|floatformat:2 }}
                </p>
            </div>
        </div>

        <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700">
            <button type="button"
                    class="w-full text-white bg-red-700 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-red-600 dark:hover:bg-red-700 dark:focus:ring-red-800"
                    disabled>
                Cerrar Caja
                <span class="ml-2 text-xs">(Próximamente)</span>
            </button>
        </div>
    </div>
</div>
