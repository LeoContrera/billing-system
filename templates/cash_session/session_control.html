{% extends "base.html" %}

{% block content %}
<div class="py-8">
    <div id="session-control-container"
         hx-get="{% url 'cash_session:session-control' %}"
         hx-trigger="load"
         hx-swap="innerHTML">
        <!-- Loading state -->
        <div class="max-w-md mx-auto">
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6">
                <div class="animate-pulse">
                    <div class="h-8 bg-gray-200 rounded dark:bg-gray-700 mb-6"></div>
                    <div class="space-y-3">
                        <div class="h-4 bg-gray-200 rounded dark:bg-gray-700"></div>
                        <div class="h-4 bg-gray-200 rounded dark:bg-gray-700"></div>
                        <div class="h-10 bg-gray-200 rounded dark:bg-gray-700"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
