{% extends "base.html" %}
{% load static %}

{% block title %}Control de Caja - Sistema POS{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <!-- Page Header -->
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-gray-900">Control de Caja</h1>
        <a href="/" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">
            ← Volver
        </a>
    </div>

    <!-- Session Control Container (HTMX Target) -->
    <div
        id="session-control-container"
        hx-get="{% url 'cash_session:session-control' %}"
        hx-trigger="load"
        hx-swap="innerHTML">

        <!-- Loading State -->
        <div class="bg-white rounded-lg border border-gray-200 p-8">
            <div class="flex items-center justify-center gap-3 text-gray-600">
                <div class="animate-spin rounded-full h-5 w-5 border-2 border-gray-300 border-t-gray-900"></div>
                <p>Cargando...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
